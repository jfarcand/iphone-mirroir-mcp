name: "Monitor: Feature Phase Review"

# Weekly caller of the llm-registre review workflow: reads feature-phases.yaml
# and opens an issue in the private jfarcand/mirroir-carnet register for any
# dark-launched feature whose review_by date has passed, so a feature that
# shipped disarmed cannot stay that way unnoticed.
on:
  schedule:
    - cron: "41 9 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  review:
    uses: dravr-ai/llm-registre/.github/workflows/feature-phase-review-reusable.yml@main
    with:
      tracker: jfarcand/mirroir-carnet
      repo_label: iphone-mirroir-mcp
      title_prefix: mirroir-mcp
    secrets:
      tracker_token: ${{ secrets.MIRROIR_CARNET_TOKEN }}
